groups:
  - name: morphflow-observability
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API target is down"
          description: "Prometheus cannot scrape API metrics for over 2 minutes."

      - alert: WorkerDown
        expr: up{job="worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker target is down"
          description: "Prometheus cannot scrape Worker metrics for over 2 minutes."

      - alert: KafkaExporterDown
        expr: up{job="kafka_consumer_lag"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Kafka exporter target is down"
          description: "Kafka lag metrics are unavailable."

      - alert: RedisExporterDown
        expr: up{job="redis_exporter"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Redis exporter target is down"
          description: "Redis metrics are unavailable."

      - alert: PostgresExporterDown
        expr: up{job="postgres_exporter"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Postgres exporter target is down"
          description: "PostgreSQL metrics are unavailable."

      - alert: KafkaConsumerLagHigh
        expr: max(kafka_consumergroup_lag) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer lag exceeded 100 for 5 minutes; consider worker scaling."

      - alert: DownstreamConsumerLagHigh
        expr: max(kafka_consumergroup_lag{consumergroup="architecture-a-worker-downstream"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Downstream consumer lag is high"
          description: "Downstream lag exceeded 100 for 5 minutes; C architecture downstream worker may be saturated."

      - alert: WorkerProcessingTimeHigh
        expr: histogram_quantile(0.95, sum(rate(job_processing_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker processing time increased"
          description: "Worker p95 processing time is high; Architecture B transition may be needed."

      - alert: InferenceConcurrencySaturated
        expr: max(inference_active_jobs) >= 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inference worker concurrency saturated"
          description: "Inference active jobs are at concurrency limit; consider scaling inference workers."

      - alert: DlqMessagesDetected
        expr: increase(dlq_messages_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DLQ messages detected"
          description: "Messages are being moved to DLQ; inspect error-reason headers and replay policy."

      - alert: PostgresResponseSlow
        expr: rate(pg_stat_database_blk_read_time{datname="fault_monitoring"}[5m]) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres read latency increased"
          description: "DB read time increased; Architecture C transition may be needed."

      - alert: DownstreamProcessingTimeHigh
        expr: histogram_quantile(0.95, sum(rate(downstream_processing_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Downstream processing time increased"
          description: "Downstream p95 latency is high; split/scale downstream workers."
