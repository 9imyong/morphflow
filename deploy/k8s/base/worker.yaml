apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: morphflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z redis 6379; do echo waiting for redis; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: worker
          image: morphflow-app:kind
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.runner"]
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: morphflow-app-config
            - secretRef:
                name: morphflow-app-secret
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: morphflow
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9000
      targetPort: 9000
