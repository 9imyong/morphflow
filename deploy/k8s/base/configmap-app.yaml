apiVersion: v1
kind: ConfigMap
metadata:
  name: morphflow-app-config
  namespace: morphflow
data:
  APP_NAME: fault-monitoring-system
  APP_ENV: development
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  WORKER_METRICS_PORT: "9000"
  ARCHITECTURE_MODE: A
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_REQUEST_TOPIC: request-topic
  KAFKA_INFERENCE_TOPIC: inference-topic
  KAFKA_RETRY_TOPIC_REQUEST: retry-topic
  KAFKA_RETRY_TOPIC_DOWNSTREAM: retry-downstream-topic
  KAFKA_DLQ_TOPIC: dlq-topic
  KAFKA_DOWNSTREAM_TOPIC: downstream-topic
  KAFKA_PARTITIONS_WORKER_TOPIC: "8"
  KAFKA_PARTITIONS_DOWNSTREAM_TOPIC: "6"
  KAFKA_TOPIC_AUTO_CONFIGURE: "true"
  KAFKA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_PARTITIONS_DLQ: "1"
  WORKER_ROLE: unified
  WORKER_PROCESSOR_BACKEND: simulator
  INFERENCE_MAX_CONCURRENCY: "2"
  INFERENCE_SIMULATED_LATENCY_MS: "700"
  INFERENCE_SIMULATED_GPU_UTILIZATION: "0.8"
  INFERENCE_SIMULATED_FAILURE_RATE: "0.0"
  INFERENCE_BATCH_ENABLED: "true"
  INFERENCE_BATCH_SIZE: "8"
  INFERENCE_BATCH_TIMEOUT_MS: "50"
  INFERENCE_BATCH_OVERHEAD_MS: "120"
  DOWNSTREAM_SIMULATED_LATENCY_MS: "300"
  KAFKA_CONSUMER_BATCH_ENABLED: "true"
  KAFKA_CONSUMER_BATCH_MAX_RECORDS: "64"
  KAFKA_CONSUMER_BATCH_TIMEOUT_MS: "200"
  IDEMPOTENCY_TTL_SECONDS: "3600"
  WORKER_PROCESSING_TTL_SECONDS: "1800"
  RETRY_MAX_COUNT: "3"
  RETRY_BACKOFF_SECONDS: "1.0"
  RETRY_BACKOFF_MULTIPLIER: "2.0"
  RETRY_BACKOFF_MAX_SECONDS: "30.0"
  LOG_LEVEL: INFO
  TRACING_ENABLED: "true"
