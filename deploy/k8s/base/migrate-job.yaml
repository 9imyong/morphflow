apiVersion: batch/v1
kind: Job
metadata:
  name: morphflow-migrate
  namespace: morphflow
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: morphflow-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z redis 6379; do echo waiting for redis; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: migrate
          image: morphflow-app:kind
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: morphflow-app-config
            - secretRef:
                name: morphflow-app-secret
