apiVersion: v1
kind: Secret
metadata:
  name: morphflow-app-secret
  namespace: morphflow
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/fault_monitoring
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DB: fault_monitoring
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
