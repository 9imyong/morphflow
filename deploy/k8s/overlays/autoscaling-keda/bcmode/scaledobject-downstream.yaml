apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: downstream-worker-kafka-lag
  namespace: morphflow
spec:
  scaleTargetRef:
    name: downstream-worker
  pollingInterval: 15
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 6
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.morphflow.svc.cluster.local:9092
        consumerGroup: architecture-main-worker-downstream
        topic: downstream-topic
        lagThreshold: "100"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
    - type: kafka
      metadata:
        bootstrapServers: kafka.morphflow.svc.cluster.local:9092
        consumerGroup: architecture-main-worker-downstream
        topic: retry-downstream-topic
        lagThreshold: "20"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
