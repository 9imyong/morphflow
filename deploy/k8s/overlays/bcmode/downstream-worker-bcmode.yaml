apiVersion: apps/v1
kind: Deployment
metadata:
  name: downstream-worker
  namespace: morphflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: downstream-worker
  template:
    metadata:
      labels:
        app: downstream-worker
    spec:
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z redis 6379; do echo waiting for redis; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: downstream-worker
          image: morphflow-app:kind
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.runner"]
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: morphflow-app-config
            - secretRef:
                name: morphflow-app-secret
          env:
            - name: WORKER_ROLE
              value: downstream
            - name: ARCHITECTURE_MODE
              value: BC
            - name: WORKER_METRICS_PORT
              value: "9001"
            - name: KAFKA_DOWNSTREAM_TOPIC
              value: downstream-topic
            - name: DOWNSTREAM_SIMULATED_LATENCY_MS
              value: "500"
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: downstream-worker
  namespace: morphflow
spec:
  selector:
    app: downstream-worker
  ports:
    - name: metrics
      port: 9001
      targetPort: 9001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: downstream-worker
  namespace: morphflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: downstream-worker
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
