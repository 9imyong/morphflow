[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/api-*_morphflow_*.log
    Parser            cri
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Inotify_Watcher   false

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/worker-*_morphflow_*.log,/var/log/containers/downstream-worker-*_morphflow_*.log
    Parser            cri
    DB                /var/log/flb_kube_worker.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Inotify_Watcher   false

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/kafka-*_morphflow_*.log,/var/log/containers/postgres-*_morphflow_*.log,/var/log/containers/redis-*_morphflow_*.log
    Parser            cri
    DB                /var/log/flb_kube_core.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Inotify_Watcher   false

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Keep_Log            Off
    Labels              On
    Annotations         Off

[OUTPUT]
    Name          es
    Match         kube.*
    Host          elasticsearch
    Port          9200
    Logstash_Format On
    Logstash_Prefix morphflow-k8s
    Suppress_Type_Name On
    Replace_Dots On
    Retry_Limit   False
