apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: morphflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-lifecycle
            - --web.external-url=http://localhost:8080/prometheus
            - --web.route-prefix=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prom-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prom-rules
              mountPath: /etc/prometheus/prometheus-rules.yml
              subPath: prometheus-rules.yml
      volumes:
        - name: prom-config
          configMap:
            name: morphflow-prometheus-config
        - name: prom-rules
          configMap:
            name: morphflow-prometheus-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: morphflow
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: morphflow
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30901
