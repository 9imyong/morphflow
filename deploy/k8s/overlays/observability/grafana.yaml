apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: morphflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/morphflow-overview.json
              subPath: morphflow-overview.json
      volumes:
        - name: datasource
          configMap:
            name: morphflow-grafana-datasource
        - name: dashboard-provider
          configMap:
            name: morphflow-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: morphflow-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: morphflow
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: morphflow
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
