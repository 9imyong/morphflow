apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: morphflow
spec:
  parentRefs:
    - name: morphflow-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /openapi.json
        - path:
            type: PathPrefix
            value: /redoc
        - path:
            type: PathPrefix
            value: /jobs
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: api
          port: 8000
