openapi: 3.1.0
info:
  title: Morphflow API
  version: 0.1.0
  description: |-
    추론 작업의 접수와 상태 조회를 제공하는 HTTP API입니다.

    작업 처리는 비동기이며 `POST /jobs`는 접수만 확인합니다.
    처리 결과는 `GET /jobs/{job_id}`로 조회합니다.

    이 계약은 아키텍처 모드(A/B/C/BC)와 무관하게 동일하게 유지됩니다.
    배경 설명은 `docs/specs/api/jobs.md`를 참조합니다.
servers:
  - url: http://localhost:8000
    description: 로컬 Compose 환경
  - url: http://localhost:18000
    description: 로컬 kind 환경 (NodePort 30081)
tags:
  - name: jobs
    description: 작업 접수와 조회
  - name: health
    description: 상태 확인
  - name: metrics
    description: 지표 노출
paths:
  /jobs:
    post:
      tags: [jobs]
      summary: 작업 생성
      description: |-
        작업을 접수하고 식별자를 반환합니다. 처리 완료를 기다리지 않습니다.

        `Idempotency-Key`를 함께 보내면 같은 키의 재요청은 새 작업을 만들지 않고
        최초 작업의 식별자를 반환합니다. 키를 생략하면 매 요청이 새 작업이 됩니다.
      operationId: createJob
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 요청 멱등성 키. 동일 키의 재요청은 최초 작업을 반환합니다.
          schema:
            type: string
            examples: ['client-req-20260913-0001']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: 작업이 접수됨. 처리 완료를 의미하지 않습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: 요청 본문이 스키마를 만족하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: 작업 상태 조회
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            examples: ['1f0c5f2e9a7b4c3d8e6f1a2b3c4d5e6f']
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '404':
          description: 해당 식별자의 작업이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /health/live:
    get:
      tags: [health]
      summary: 프로세스 생존 확인
      description: 의존성을 확인하지 않고 프로세스 응답 여부만 반환합니다.
      operationId: getHealthLive
      responses:
        '200':
          description: 프로세스가 응답 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [health]
      summary: 의존성 포함 요청 처리 가능 여부 확인
      description: |-
        PostgreSQL, Redis, Kafka 연결을 각각 확인합니다.
        하나라도 실패하면 `503`을 반환하며, 본문에는 항목별 결과가 포함됩니다.
      operationId: getHealthReady
      responses:
        '200':
          description: 모든 의존성 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 하나 이상의 의존성 비정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus 지표 노출
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus 텍스트 형식 지표
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    JobCreateRequest:
      type: object
      required: [input]
      properties:
        input:
          type: object
          description: 추론 입력 payload
          additionalProperties: true
          examples:
            - { type: text, content: hello morphflow }
        options:
          type: object
          description: |-
            선택적 실행 제어. 시뮬레이터 사용 시 아래 키로 건별 동작을 재정의할 수 있습니다.
            - `simulate_inference_ms`: 처리 지연(밀리초)
            - `simulate_inference_failure_rate`: 실패 확률(0.0~1.0)
          additionalProperties: true
          default: {}
          examples:
            - { priority: normal, simulate_inference_ms: 900, simulate_inference_failure_rate: 0.1 }
    JobResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          examples: ['1f0c5f2e9a7b4c3d8e6f1a2b3c4d5e6f']
        status:
          $ref: '#/components/schemas/JobStatus'
    JobDetailResponse:
      type: object
      required: [job_id, status, result, error]
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        result:
          type: [object, 'null']
          description: 처리 결과. 완료 전에는 null입니다.
          additionalProperties: true
        error:
          type: [string, 'null']
          description: 실패 사유. 실패하지 않았으면 null입니다.
    JobStatus:
      type: string
      description: |-
        - `PENDING`: 접수되어 처리 대기 중
        - `PROCESSING`: 워커가 처리 중. C·BC 모드에서는 추론 완료 후 후단 처리 대기도 포함합니다.
        - `SUCCESS`: 처리 완료
        - `FAILED`: 처리 실패. 재시도가 남아 있으면 이후 SUCCESS로 바뀔 수 있습니다.
      enum: [PENDING, PROCESSING, SUCCESS, FAILED]
    HealthResponse:
      type: object
      required: [status, dependencies, details]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: object
          description: 의존성별 상세 결과
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, error]
              detail:
                type: string
          examples:
            - database: { status: ok, detail: connection ok }
              redis: { status: ok, detail: ping ok }
              kafka: { status: ok, detail: 'ok (1 broker(s))' }
        details:
          type: object
          description: 의존성별 상태 요약
          additionalProperties:
            type: string
    NotFoundError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          examples: ['Job not found']
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string
