services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: morphflow-obsv-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    ports:
      - "9091:9090"
    restart: unless-stopped
    networks:
      - morphflow_shared

  grafana:
    image: grafana/grafana:11.2.2
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    container_name: morphflow-obsv-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - elasticsearch
    networks:
      - morphflow_shared

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: morphflow-obsv-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - morphflow_shared

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: morphflow-obsv-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - morphflow_shared

  fluent-bit:
    image: fluent/fluent-bit:3.2.2
    container_name: morphflow-obsv-fluent-bit
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    volumes:
      - ./deploy/observability/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - morphflow_shared

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: morphflow-obsv-kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    restart: unless-stopped
    networks:
      - morphflow_shared

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: morphflow-obsv-redis-exporter
    command:
      - "--redis.addr=redis://redis:6379"
    restart: unless-stopped
    networks:
      - morphflow_shared

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: morphflow-obsv-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@postgres:5432/fault_monitoring?sslmode=disable
    restart: unless-stopped
    networks:
      - morphflow_shared

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: morphflow-obsv-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped
    networks:
      - morphflow_shared

networks:
  morphflow_shared:
    external: true
    name: morphflow_default
