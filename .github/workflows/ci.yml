name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/fault_monitoring
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest -q

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Syntax compile check
        run: python -m compileall -q app scripts tests

      - name: Dependency integrity check
        run: python -m pip check

  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fault_monitoring
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d fault_monitoring"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/fault_monitoring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Check migration drift
        run: alembic check

  k8s-manifest-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Build kustomize manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t KUSTOMIZE_DIRS < <(find deploy/k8s -type f -name 'kustomization.yaml' -exec dirname {} \; | sort)
          if [ "${#KUSTOMIZE_DIRS[@]}" -eq 0 ]; then
            echo "No kustomization.yaml found under deploy/k8s"
            exit 1
          fi

          for dir in "${KUSTOMIZE_DIRS[@]}"; do
            echo "validating: $dir"
            kubectl kustomize "$dir" >/dev/null
          done
